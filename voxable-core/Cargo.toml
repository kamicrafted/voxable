[package]
name = "voxable-core"
version = "0.1.0"
edition = "2021"
description = "Pure, host-independent logic for Voxable (no Tauri/whisper/cpal/OS deps)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
