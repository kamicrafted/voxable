[package]
name = "voxable"
version = "0.2.0"
description = "Voxable - local voice dictation with AI cleanup"
authors = ["Dave Yoon"]
license = "MIT"
edition = "2021"

[features]
# GPU acceleration backends for whisper.cpp. Enable at build time:
#   Windows/Linux (NVIDIA):  tauri build --features cuda
#   macOS (Apple Silicon):   tauri build --features metal
# With no feature, Whisper runs on CPU.
cuda = ["whisper-rs/cuda"]
metal = ["whisper-rs/metal"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required for the transparent Flow Bar window on macOS.
# Pairs with app.macOSPrivateApi in tauri.conf.json; both are needed.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
parking_lot = "0.12"
whisper-rs = "0.16"
cpal = "0.15"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
# Pure logic lives here (omp owns it; testable with rustup alone).
voxable-core = { path = "../voxable-core" }

# macOS: Fn-key event tap, synthesized Cmd+V, permission checks, frontmost app.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
# The AVFoundation microphone prompt takes a completion block.
block2 = "0.6"

# Win32: foreground-app detection, non-activating Flow Bar, synthesized paste.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# NOTE: [profile.release] moved to the workspace root Cargo.toml (member profiles
# are ignored in a workspace).
