<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxable Flow Bar</title>
    <link rel="stylesheet" href="/flowbar.css" />
  </head>
  <body>
    <!-- Four states, one layout: a 28px state icon, a label, and a right-aligned
         meta slot (the hotkey when ready, elapsed time while recording). The icons
         carry their own circular gradient, so nothing here draws the circle. -->
    <div id="pill" data-tauri-drag-region>
      <button id="mic" title="Start / stop dictation (or press your hotkey)"></button>

      <div id="center" data-tauri-drag-region>
        <div id="status" data-tauri-drag-region>Ready</div>
        <div id="meta" data-tauri-drag-region></div>
      </div>
    </div>
    <script type="module" src="/flowbar.js"></script>
  </body>
</html>
