<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxable Flow Bar</title>
    <link rel="stylesheet" href="/flowbar.css" />
  </head>
  <body>
    <div id="pill" data-tauri-drag-region>
      <button id="mic" title="Start / stop dictation (or press your hotkey)">
        <svg class="ic-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" />
          <path d="M19 10v1a7 7 0 0 1-14 0v-1" />
          <line x1="12" y1="19" x2="12" y2="22" />
        </svg>
        <svg class="ic-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2" /></svg>
      </button>

      <div id="center" data-tauri-drag-region>
        <div id="status" data-tauri-drag-region>Ready</div>
        <div id="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
        <div id="preview" data-tauri-drag-region></div>
      </div>

      <button id="copy" title="Copy last result" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="12" height="12" rx="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
      </button>
    </div>
    <script type="module" src="/flowbar.js"></script>
  </body>
</html>
